name: "Mixed Compatibility Scenarios"
description: "Complex real-world scenarios mixing multiple data types"
tests:
  - name: "user_profile"
    query: "SELECT ('John Doe' as name, 30 as age, ['reading', 'coding', 'music'] as hobbies, map('city', 'New York', 'country', 'USA') as location, true::Bool as active) as user_profile"
    
  - name: "time_series_data"
    query: "SELECT [(toDateTime('2023-01-01 00:00:00'), 100.5), (toDateTime('2023-01-01 01:00:00'), 105.2), (toDateTime('2023-01-01 02:00:00'), 98.7)] as time_series"
    
  - name: "product_catalog"
    query: "SELECT ('Electronics' as category, [('Laptop', 999.99, [('CPU', 'Intel i7'), ('RAM', '16GB')]), ('Phone', 699.99, [('OS', 'Android'), ('Storage', '128GB')])] as products) as catalog"
    
  - name: "mixed_arrays_complex"
    query: "SELECT [('item1', [1, 2, 3]), ('item2', [4, 5, 6]), ('item3', [7, 8, 9])] as complex_array, [[('a', 1), ('b', 2)], [('c', 3), ('d', 4)]] as nested_tuple_array"
    
  - name: "financial_data"
    query: "SELECT (toDecimal64(1234.56, 2) as amount, 'USD' as currency, toDateTime('2023-12-25 10:30:00') as timestamp, map('type', 'purchase', 'merchant', 'Store ABC') as metadata) as transaction"