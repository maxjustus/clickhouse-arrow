name: "Tuple Types"
description: "Test tuple data structures including named and unnamed tuples"
tests:
  - name: "simple_tuples"
    query: "SELECT (1, 'hello') as simple_tuple, tuple(42, 3.14, 'world') as explicit_tuple"
    
  - name: "named_tuples"
    query: "SELECT ('Alice' as name, 25 as age) as person, ('red' as color, 100 as value) as item"
    
  - name: "nested_tuples"
    query: "SELECT (1, ('nested', 2), 3) as nested_tuple, ((1, 2), (3, 4)) as tuple_of_tuples"
    
  - name: "mixed_type_tuples"
    query: "SELECT (42, 'string', 3.14, toDate('2023-01-01'), [1, 2, 3]) as mixed_tuple"
    
  - name: "complex_named_tuples"
    query: "SELECT ('John' as first_name, 'Doe' as last_name, 30 as age, ('123 Main St' as street, 'Anytown' as city) as address) as person_record"
    
  - name: "empty_and_single_tuples"
    query: "SELECT tuple() as empty_tuple, tuple(42) as single_element"