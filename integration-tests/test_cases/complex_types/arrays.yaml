name: "Array Types"
description: "Test array data structures"
tests:
  - name: "basic_arrays"
    query: "SELECT [1, 2, 3, 4, 5] as int_array, ['hello', 'world', 'test'] as string_array, [] as empty_array"
    
  - name: "typed_arrays"
    query: "SELECT [1::UInt8, 2::UInt8, 3::UInt8] as uint8_array, [3.14::Float32, 2.71::Float32] as float_array"
    
  - name: "nested_arrays"
    query: "SELECT [[1, 2], [3, 4], [5, 6]] as nested_int, [['a', 'b'], ['c', 'd']] as nested_string"
    
  - name: "large_arrays"
    query: "SELECT range(1000) as large_range, arrayMap(x -> x * x, range(100)) as squared_array"
    
  - name: "mixed_content_arrays"
    query: "SELECT [NULL, 1, 2, NULL, 3] as nullable_array, [toDate('2023-01-01'), toDate('2023-12-31')] as date_array"