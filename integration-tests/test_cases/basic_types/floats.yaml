name: "Floating Point Types"
description: "Test floating point data types"
tests:
  - name: "float32"
    query: "SELECT 3.14159::Float32 as pi_f32, -1.5::Float32 as negative_f32, 0.0::Float32 as zero_f32"
    
  - name: "float64"
    query: "SELECT 3.141592653589793::Float64 as pi_f64, -2.718281828459045::Float64 as e_negative, 1.7976931348623157e308::Float64 as max_f64"
    
  - name: "special_values"
    query: "SELECT nan::Float32 as nan_f32, inf::Float32 as inf_f32, -inf::Float32 as neg_inf_f32, nan::Float64 as nan_f64, inf::Float64 as inf_f64"
    
  - name: "decimals"
    query: "SELECT toDecimal32(123.45, 2) as dec32, toDecimal64(123.456789, 6) as dec64, toDecimal128(12345.6789012345, 10) as dec128"