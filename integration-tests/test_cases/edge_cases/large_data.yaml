name: "Large Data Structures"
description: "Test handling of large arrays, strings, and nested structures"
tests:
  - name: "large_arrays"
    query: "SELECT range(10000) as large_array, arrayMap(x -> toString(x), range(1000)) as large_string_array"
    
  - name: "large_strings"
    query: "SELECT repeat('Hello World! ', 1000) as large_string, repeat('🌍', 500) as large_unicode"
    
  - name: "deeply_nested"
    query: "SELECT [[[[[1]]]]] as deep_nested, (((((42))))) as deep_tuple"
    
  - name: "large_tuples"
    query: "SELECT tuple(range(100)[1], range(100)[2], range(100)[3], range(100)[4], range(100)[5]) as large_tuple"