name: "NULL Handling"
description: "Test NULL values and nullable types"
tests:
  - name: "basic_nulls"
    query: "SELECT NULL as null_val, toNullable(42) as nullable_int, toNullable('hello') as nullable_string"
    
  - name: "null_arrays"
    query: "SELECT [1, NULL, 3] as nullable_int_array, ['a', NULL, 'c'] as nullable_string_array"
    
  - name: "null_tuples"
    query: "SELECT (NULL, 'value') as null_tuple, (1, NULL, 'test') as mixed_null_tuple"
    
  - name: "null_maps"
    query: "SELECT map('key1', NULL, 'key2', 'value') as map_with_null"
    
  - name: "deeply_nested_nulls"
    query: "SELECT [[(NULL, 1), (2, NULL)], [(3, 4), (NULL, NULL)]] as nested_null_tuples"