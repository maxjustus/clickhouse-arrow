name: "Empty Data Structures"
description: "Test empty arrays, tuples, maps, and strings"
tests:
  - name: "empty_structures"
    query: "SELECT [] as empty_array, '' as empty_string, tuple() as empty_tuple"
    
  - name: "empty_nested"
    query: "SELECT [[]] as empty_nested_array, [tuple()] as array_of_empty_tuples"
    
  - name: "empty_typed"
    query: "SELECT CAST([], 'Array(Int32)') as empty_int_array, CAST([], 'Array(String)') as empty_string_array"
    
  - name: "empty_complex"
    query: "SELECT [CAST([], 'Array(Int32)'), CAST([1, 2], 'Array(Int32)')] as mixed_empty_arrays"