name: "Dynamic Type"
description: "Test Dynamic type implementation"
tests:
  - name: "basic_dynamic"
    query: "SELECT 'hello'::Dynamic as dynamic_string, 42::Dynamic as dynamic_int, [1, 2, 3]::Dynamic as dynamic_array"
    
  - name: "complex_dynamic"
    query: "SELECT ('name', 'value')::Dynamic as dynamic_tuple, map('key', 'value')::Dynamic as dynamic_map"
    
  - name: "dynamic_arrays"
    query: "SELECT ['string'::Dynamic, 123::Dynamic, [1, 2]::Dynamic] as mixed_dynamic_array"