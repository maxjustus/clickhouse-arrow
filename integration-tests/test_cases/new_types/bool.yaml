name: "Bool Type"
description: "Test native Bool type implementation"
tests:
  - name: "basic_bool"
    query: "SELECT true::Bool as bool_true, false::Bool as bool_false"
    
  - name: "bool_operations"
    query: "SELECT (true::Bool AND false::Bool) as and_result, (true::Bool OR false::Bool) as or_result, NOT true::Bool as not_result"
    
  - name: "bool_arrays"
    query: "SELECT [true::Bool, false::Bool, true::Bool] as bool_array"
    
  - name: "bool_in_tuples"
    query: "SELECT (true::Bool, 'enabled') as status_tuple, ('feature_flag', false::Bool) as flag_tuple"