name: "Aggregate Function Types"
description: "Test AggregateFunction and SimpleAggregateFunction types"
tests:  
  - name: "basic_aggregate_functions"
    query: "SELECT CAST(1, 'AggregateFunction(count, UInt64)') as count_state, CAST(42, 'AggregateFunction(sum, UInt64)') as sum_state"
    
  - name: "simple_aggregate_functions"  
    query: "SELECT CAST(10, 'SimpleAggregateFunction(max, UInt32)') as max_simple, CAST(5, 'SimpleAggregateFunction(min, UInt32)') as min_simple"
    
  - name: "complex_aggregate_functions"
    query: "SELECT CAST('test', 'AggregateFunction(uniq, String)') as uniq_state"