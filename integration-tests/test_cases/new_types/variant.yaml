name: "Variant Type"
description: "Test Variant/Union type implementation"
tests:
  - name: "basic_variant"
    query: "SELECT 'hello'::Variant(String, UInt64) as string_variant, 42::Variant(String, UInt64) as int_variant"
    
  - name: "complex_variant"
    query: "SELECT [1, 2, 3]::Variant(String, Array(UInt32)) as array_variant, 'text'::Variant(String, Array(UInt32)) as string_variant"
    
  - name: "nested_variant"
    query: "SELECT 'nested_string'::Variant(UUID, Array(Variant(String, UInt64))) as nested_variant"
    
  - name: "variant_arrays"
    query: "SELECT ['a'::Variant(String, UInt32), 123::Variant(String, UInt32)] as variant_array"