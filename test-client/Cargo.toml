[package]
name = "clickhouse-test-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clickhouse-arrow = { path = "../clickhouse-arrow", features = ["test-utils", "derive", "serde"] }
anyhow = "1.0"
bytes = "1.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-transcode = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
atty = "0.2"
hex = "0.4"
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"
dirs = "5.0"
chrono = "0.4"
arboard = "3.4"

[features]
default = []
